<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Where should this go? — a proposal you decide</title><desc id="d">One fed item opened: the original on the left exactly as given, KILN's labelled draft proposal on the right with six destinations and what each does, none pre-selected.</desc><rect width="1280" height="820" fill="#F4F1EA"/><rect x="0" y="0" width="200" height="820" fill="#14201F"/><text x="18" y="34" font-size="17" font-weight="700" fill="#E9EFEC" text-anchor="start">KILN</text><text x="18" y="52" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">Workshop · this machine</text><text x="22" y="84" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Needs you</text><rect x="150" y="70" width="30" height="20" rx="10" fill="#0F766E" stroke="none" stroke-width="0"/><text x="165" y="84" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="8" y="97" width="184" height="28" rx="6" fill="#1B3331"/><rect x="8" y="97" width="3" height="28" fill="#0F766E"/><text x="22" y="114" font-size="13" font-weight="600" fill="#E9EFEC" text-anchor="start">Feed</text><rect x="150" y="100" width="30" height="20" rx="10" fill="#27403D" stroke="none" stroke-width="0"/><text x="165" y="114" font-size="11.5" font-weight="700" fill="#E9EFEC" text-anchor="middle">4</text><text x="22" y="144" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Factories</text><text x="22" y="174" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Team space</text><text x="22" y="204" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Record</text><text x="22" y="234" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Knowledge</text><text x="22" y="264" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Bench</text><text x="22" y="294" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Insights</text><text x="22" y="324" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Models &amp; policy</text><text x="18" y="380" font-size="10.5" font-weight="600" fill="#7E948F" text-anchor="start">FACTORIES</text><circle cx="24" cy="400" r="4.5" fill="#86D08A"/><text x="36" y="404" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">orders-api</text><text x="182" y="404" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">working</text><circle cx="24" cy="426" r="4.5" fill="#F2B24A"/><text x="36" y="430" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">billing</text><text x="182" y="430" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">waiting</text><circle cx="24" cy="452" r="4.5" fill="#8FB0F5"/><text x="36" y="456" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">mobile</text><text x="182" y="456" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">new</text><rect x="10" y="742" width="180" height="64" rx="8" fill="#162B29" stroke="none" stroke-width="0"/><text x="20" y="762" font-size="11" font-weight="600" fill="#B9CBC6" text-anchor="start">This machine</text><text x="20" y="780" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">memory 41 of 64 GB in use</text><rect x="20" y="788" width="160" height="5" rx="2.5" fill="#27403D"/><rect x="20" y="788" width="102" height="5" rx="2.5" fill="#0F766E"/><text x="230" y="40" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Workshop › Feed › Checkout loses the cart</text><text x="230" y="76" font-size="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Where should this go?</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">You fed this today at 14:12. KILN kept it as given and drafted a proposal.</text><rect x="1110" y="30" width="140" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1180.0" y="51.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Feed KILN</text><rect x="230" y="122" width="470" height="660" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="250" y="152" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">AS YOU GAVE IT</text><text x="250" y="180" font-size="14.5" font-weight="400" fill="#14201F" text-anchor="start">The checkout page loses the cart when someone switches</text><text x="250" y="202" font-size="14.5" font-weight="400" fill="#14201F" text-anchor="start">from card to invoice. Steffi saw it on the staging</text><text x="250" y="224" font-size="14.5" font-weight="400" fill="#14201F" text-anchor="start">build today — screenshot attached. Might be related to</text><text x="250" y="246" font-size="14.5" font-weight="400" fill="#14201F" text-anchor="start">the billing retry thing from last week.</text><rect x="250" y="300" width="430" height="150" rx="10" fill="#EFEAE3" stroke="none" stroke-width="0"/><text x="465" y="382" font-size="13" font-weight="500" fill="#56625F" text-anchor="middle">cart-lost.png</text><text x="465" y="402" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="middle">screenshot · 1280×720</text><rect x="250" y="466" width="68.6" height="22" rx="11" fill="#F0EBE4" stroke="none" stroke-width="0"/><text x="259" y="481" font-size="11.5" font-weight="500" fill="#14201F" text-anchor="start">BILL-482</text><rect x="324.6" y="466" width="112.87500000000001" height="22" rx="11" fill="#F0EBE4" stroke="none" stroke-width="0"/><text x="333.6" y="481" font-size="11.5" font-weight="500" fill="#14201F" text-anchor="start">steffi's thread</text><rect x="443.475" y="466" width="112.87500000000001" height="22" rx="11" fill="#F0EBE4" stroke="none" stroke-width="0"/><text x="452.475" y="481" font-size="11.5" font-weight="500" fill="#14201F" text-anchor="start">voice note 0:42</text><text x="250" y="520" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">WHAT KILN FOUND</text><text x="250" y="544" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">It mentions billing retries — the factory “billing” has a</text><text x="250" y="563" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">Feature touching retries (in Code review). BILL-482 is open</text><text x="250" y="582" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">and unassigned.</text><rect x="250" y="606" width="209.425" height="22" rx="11" fill="#E2EAFB" stroke="none" stroke-width="0"/><circle cx="261" cy="617" r="4" fill="#1F4FB8"/><text x="271" y="621" font-size="11.5" font-weight="500" fill="#1F4FB8" text-anchor="start">touches: billing · orders-api</text><rect x="250" y="636" width="241.05" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><circle cx="261" cy="647" r="4" fill="#8A4B04"/><text x="271" y="651" font-size="11.5" font-weight="500" fill="#8A4B04" text-anchor="start">overlap with a Feature in progress</text><text x="250" y="696" font-size="12" font-weight="400" fill="#276B2A" text-anchor="start">Nothing was sent anywhere. Everything above is on this machine.</text><rect x="722" y="122" width="528" height="660" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="742" y="152" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">A DRAFT BY THE PLANNER — WHERE IT COULD GO</text><rect x="742" y="170" width="488" height="82" rx="12" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><circle cx="766" cy="194" r="8" fill="none" stroke="#B5AA9C" stroke-width="1.6"/><text x="786" y="199" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">A new Feature candidate in orders-api</text><text x="786" y="220" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Appears on the roadmap as a candidate. Nothing is built until you</text><text x="786" y="236" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">admit it at the Roadmap gate.</text><rect x="742" y="262" width="488" height="82" rx="12" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><circle cx="766" cy="286" r="8" fill="none" stroke="#B5AA9C" stroke-width="1.6"/><text x="786" y="291" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">Evidence for the billing Feature in Code review</text><text x="786" y="312" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Shown to the reviewer and to you in the brief, labelled “from your</text><text x="786" y="328" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">feed”. Does not change the work.</text><rect x="742" y="354" width="488" height="82" rx="12" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><circle cx="766" cy="378" r="8" fill="none" stroke="#B5AA9C" stroke-width="1.6"/><text x="786" y="383" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">An input to the next roadmap</text><text x="786" y="404" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">The planner reads it when it next shapes the roadmap. You can</text><text x="786" y="420" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">remove it any time.</text><rect x="742" y="446" width="488" height="82" rx="12" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><circle cx="766" cy="470" r="8" fill="none" stroke="#B5AA9C" stroke-width="1.6"/><text x="786" y="475" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">A Knowledge page</text><text x="786" y="496" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Written up as a page labelled “from a person”, linked to BILL-482.</text><rect x="742" y="538" width="488" height="82" rx="12" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><circle cx="766" cy="562" r="8" fill="none" stroke="#B5AA9C" stroke-width="1.6"/><text x="786" y="567" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">A question for a step</text><text x="786" y="588" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Asks the next step that touches checkout to look at this first.</text><rect x="742" y="630" width="488" height="82" rx="12" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><circle cx="766" cy="654" r="8" fill="none" stroke="#B5AA9C" stroke-width="1.6"/><text x="786" y="659" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">Keep it as a note</text><text x="786" y="680" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Stays in Feed → Notes. Nothing else happens.</text><text x="742" y="742" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">No option is selected for you. Choose one or more.</text><rect x="1050" y="730" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#B9CBC6" stroke-width="1"/><text x="1090.0" y="751.5" font-size="13" font-weight="600" fill="#14201F" text-anchor="middle">Not now</text><rect x="1140" y="730" width="90" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1185.0" y="751.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirm</text></svg>