<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">KILN theme — teal and sand</title><desc id="d">Foundations sheet: neutral, accent and status swatches with their hex values and contrast ratios, plus the type specimen for display, interface and monospace faces.</desc><rect width="1280" height="820" fill="#F4F1EA"/><text x="40" y="64" font-size="32" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">KILN theme — teal and sand</text><text x="40" y="92" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">Foundations sheet · design system 0.2.0 (proposal) · contrast values are measured, WCAG 2.2</text><text x="40" y="130" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">NEUTRALS</text><rect x="40" y="142" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="40" y="142" width="190" height="64" rx="12" fill="#F4F1EA" stroke="#DDD7CA" stroke-width="1"/><rect x="40" y="182" width="190" height="24" fill="#F4F1EA"/><text x="52" y="228" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">surface.page</text><text x="52" y="246" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#F4F1EA · ink 14.8</text><rect x="240" y="142" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="240" y="142" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="240" y="182" width="190" height="24" fill="#FFFFFF"/><text x="252" y="228" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">surface.raised</text><text x="252" y="246" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#FFFFFF · muted 6.4</text><rect x="440" y="142" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="440" y="142" width="190" height="64" rx="12" fill="#DDD7CA" stroke="none" stroke-width="1"/><rect x="440" y="182" width="190" height="24" fill="#DDD7CA"/><text x="452" y="228" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">border.default</text><text x="452" y="246" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#DDD7CA · decor.</text><rect x="640" y="142" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="640" y="142" width="190" height="64" rx="12" fill="#56625F" stroke="none" stroke-width="1"/><rect x="640" y="182" width="190" height="24" fill="#56625F"/><text x="652" y="228" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">text.muted</text><text x="652" y="246" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#56625F · 5.6 on page</text><rect x="840" y="142" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="840" y="142" width="190" height="64" rx="12" fill="#14201F" stroke="none" stroke-width="1"/><rect x="840" y="182" width="190" height="24" fill="#14201F"/><text x="852" y="228" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">text.primary</text><text x="852" y="246" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#14201F · 14.8 on page</text><rect x="1040" y="142" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="1040" y="142" width="190" height="64" rx="12" fill="#10201F" stroke="none" stroke-width="1"/><rect x="1040" y="182" width="190" height="24" fill="#10201F"/><text x="1052" y="228" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">rail.surface</text><text x="1052" y="246" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#10201F · text 14.4</text><text x="40" y="280" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">ACCENT</text><rect x="40" y="292" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="40" y="292" width="190" height="64" rx="12" fill="#0F766E" stroke="none" stroke-width="1"/><rect x="40" y="332" width="190" height="24" fill="#0F766E"/><text x="52" y="378" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">accent.default</text><text x="52" y="396" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#0F766E · white 5.5</text><rect x="240" y="292" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="240" y="292" width="190" height="64" rx="12" fill="#0B5F58" stroke="none" stroke-width="1"/><rect x="240" y="332" width="190" height="24" fill="#0B5F58"/><text x="252" y="378" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">accent.hover</text><text x="252" y="396" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#0B5F58 · white 7.4</text><rect x="440" y="292" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="440" y="292" width="190" height="64" rx="12" fill="#DCEEEA" stroke="none" stroke-width="1"/><rect x="440" y="332" width="190" height="24" fill="#DCEEEA"/><text x="452" y="378" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">accent.subtle</text><text x="452" y="396" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#DCEEEA · text 13.9</text><rect x="640" y="292" width="190" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="640" y="292" width="190" height="64" rx="12" fill="#2DD4BF" stroke="none" stroke-width="1"/><rect x="640" y="332" width="190" height="24" fill="#2DD4BF"/><text x="652" y="378" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="start">accent.on-rail</text><text x="652" y="396" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">#2DD4BF · on rail 9.0</text><rect x="840" y="292" width="400" height="112" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="856" y="318" font-size="13" font-weight="600" fill="#14201F" text-anchor="start">The logo uses the same teal.</text><text x="856" y="340" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">The nested-gates mark is teal on light and light teal on</text><text x="856" y="357" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">dark, and the wordmark is set in Charter Bold: the logo</text><text x="856" y="374" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">is made of the same tokens as the interface.</text><text x="40" y="430" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">STATUS — always a word and a shape, never colour alone</text><rect x="40" y="444" width="188" height="34" rx="17" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="56" y="466" font-size="13.5" font-weight="600" fill="#8A4B04" text-anchor="start">● Waiting for you</text><text x="56" y="496" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">wait 5.8</text><rect x="240" y="444" width="188" height="34" rx="17" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="256" y="466" font-size="13.5" font-weight="600" fill="#276B2A" text-anchor="start">✓ Passed</text><text x="256" y="496" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">ok 5.5</text><rect x="440" y="444" width="188" height="34" rx="17" fill="#ECE5F9" stroke="none" stroke-width="0"/><text x="456" y="466" font-size="13.5" font-weight="600" fill="#5B33B0" text-anchor="start">◆ Delegated</text><text x="456" y="496" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">delegated 6.7</text><rect x="640" y="444" width="188" height="34" rx="17" fill="#E2EAFB" stroke="none" stroke-width="0"/><text x="656" y="466" font-size="13.5" font-weight="600" fill="#1F4FB8" text-anchor="start">ⓘ Working</text><text x="656" y="496" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">info 6.1</text><rect x="840" y="444" width="188" height="34" rx="17" fill="#FBE3DF" stroke="none" stroke-width="0"/><text x="856" y="466" font-size="13.5" font-weight="600" fill="#A82A1D" text-anchor="start">✕ Rejected</text><text x="856" y="496" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">danger 5.7</text><text x="40" y="540" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">TYPE</text><rect x="40" y="552" width="380" height="230" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="56" y="576" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">Display · Charter</text><text x="56" y="624" font-size="34" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">3 decisions are waiting</text><text x="56" y="664" font-size="20" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Headings and the gate question.</text><text x="56" y="700" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Used for page headings only: a human voice for the</text><text x="56" y="717" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">one sentence each screen says.</text><rect x="440" y="552" width="380" height="230" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="456" y="576" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">Interface · Inter</text><text x="456" y="616" font-size="22" font-weight="600" fill="#14201F" text-anchor="start">Open gate brief</text><text x="456" y="646" font-size="16" font-weight="400" fill="#14201F" text-anchor="start">Nothing waits on you here.</text><text x="456" y="672" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">Verifier is checking the feature</text><text x="456" y="700" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Everything people read and click: body, labels,</text><text x="456" y="717" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">tables, buttons. Tabular figures for counts and</text><text x="456" y="734" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">times.</text><rect x="840" y="552" width="400" height="230" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="856" y="576" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">Monospace · DejaVu Sans Mono</text><text x="856" y="616" font-size="14" fill="#14201F" font-family="DejaVu Sans Mono, ui-monospace, monospace">S6.R9  retry.ts:41</text><text x="856" y="642" font-size="14" fill="#14201F" font-family="DejaVu Sans Mono, ui-monospace, monospace">c322d12  spec-v2.md</text><text x="856" y="668" font-size="14" fill="#56625F" font-family="DejaVu Sans Mono, ui-monospace, monospace">$ kiln feed ./cart-lost.png</text><text x="856" y="700" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Ids, paths, hashes, commands. Never for sentences.</text></svg>