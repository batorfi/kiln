<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Feed KILN — drop anything</title><desc id="d">The Feed composer open over the Workshop overview: a free text box, attached items of different kinds, a local-only note, and one primary button.</desc><rect width="1280" height="820" fill="#F4F1EA"/><rect x="0" y="0" width="200" height="820" fill="#14201F"/><text x="18" y="34" font-size="17" font-weight="700" fill="#E9EFEC" text-anchor="start">KILN</text><text x="18" y="52" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">Workshop · this machine</text><text x="22" y="84" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Needs you</text><rect x="150" y="70" width="30" height="20" rx="10" fill="#0F766E" stroke="none" stroke-width="0"/><text x="165" y="84" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="8" y="97" width="184" height="28" rx="6" fill="#1B3331"/><rect x="8" y="97" width="3" height="28" fill="#0F766E"/><text x="22" y="114" font-size="13" font-weight="600" fill="#E9EFEC" text-anchor="start">Feed</text><rect x="150" y="100" width="30" height="20" rx="10" fill="#27403D" stroke="none" stroke-width="0"/><text x="165" y="114" font-size="11.5" font-weight="700" fill="#E9EFEC" text-anchor="middle">4</text><text x="22" y="144" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Factories</text><text x="22" y="174" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Team space</text><text x="22" y="204" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Record</text><text x="22" y="234" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Knowledge</text><text x="22" y="264" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Bench</text><text x="22" y="294" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Insights</text><text x="22" y="324" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Models &amp; policy</text><text x="18" y="380" font-size="10.5" font-weight="600" fill="#7E948F" text-anchor="start">FACTORIES</text><circle cx="24" cy="400" r="4.5" fill="#86D08A"/><text x="36" y="404" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">orders-api</text><text x="182" y="404" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">working</text><circle cx="24" cy="426" r="4.5" fill="#F2B24A"/><text x="36" y="430" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">billing</text><text x="182" y="430" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">waiting</text><circle cx="24" cy="452" r="4.5" fill="#8FB0F5"/><text x="36" y="456" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">mobile</text><text x="182" y="456" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">new</text><rect x="10" y="742" width="180" height="64" rx="8" fill="#162B29" stroke="none" stroke-width="0"/><text x="20" y="762" font-size="11" font-weight="600" fill="#B9CBC6" text-anchor="start">This machine</text><text x="20" y="780" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">memory 41 of 64 GB in use</text><rect x="20" y="788" width="160" height="5" rx="2.5" fill="#27403D"/><rect x="20" y="788" width="102" height="5" rx="2.5" fill="#0F766E"/><text x="230" y="40" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Workshop › Feed</text><text x="230" y="76" font-size="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Feed KILN anything</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">No form, no structure. KILN keeps it, sorts it, and asks before it acts.</text><rect x="1110" y="30" width="140" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1180.0" y="51.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Feed KILN</text><rect x="230" y="124" width="1020" height="330" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="256" y="158" font-size="17" font-weight="400" fill="#14201F" text-anchor="start">The checkout page loses the cart when someone switches from card to invoice. Steffi saw it on the staging</text><text x="256" y="184" font-size="17" font-weight="400" fill="#14201F" text-anchor="start">build today — screenshot attached. Might be related to the billing retry thing from last week. Not urgent</text><text x="256" y="210" font-size="17" font-weight="400" fill="#14201F" text-anchor="start">but I don't want to forget it.</text><line x1="256" y1="262" x2="1224" y2="262" stroke="#DDD7CA"/><text x="256" y="290" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">Attached</text><rect x="256" y="302" width="226" height="46" rx="10" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><rect x="262" y="308" width="34" height="34" rx="8" fill="#F0EBE4" stroke="none" stroke-width="0"/><path d="M9 12h16v12H9zM13 12l2-3h4l2 3M17 21a3 3 0 100-6 3 3 0 000 6" transform="translate(262,308)" fill="none" stroke="#56625F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="330" font-size="12.5" font-weight="500" fill="#14201F" text-anchor="start">cart-lost.png</text><rect x="492" y="302" width="226" height="46" rx="10" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><rect x="498" y="308" width="34" height="34" rx="8" fill="#F0EBE4" stroke="none" stroke-width="0"/><path d="M13 21l8-8M11 17a4 4 0 010-5l2-2a4 4 0 015 0M23 17a4 4 0 010 5l-2 2a4 4 0 01-5 0" transform="translate(498,308)" fill="none" stroke="#56625F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="330" font-size="12.5" font-weight="500" fill="#14201F" text-anchor="start">steffi's thread</text><rect x="728" y="302" width="226" height="46" rx="10" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><rect x="734" y="308" width="34" height="34" rx="8" fill="#F0EBE4" stroke="none" stroke-width="0"/><path d="M9 13h16v4a2 2 0 000 4v4H9v-4a2 2 0 000-4z" transform="translate(734,308)" fill="none" stroke="#56625F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="776" y="330" font-size="12.5" font-weight="500" fill="#14201F" text-anchor="start">BILL-482</text><rect x="964" y="302" width="226" height="46" rx="10" fill="#FAF8F5" stroke="#DDD7CA" stroke-width="1"/><rect x="970" y="308" width="34" height="34" rx="8" fill="#F0EBE4" stroke="none" stroke-width="0"/><path d="M17 9a3 3 0 013 3v5a3 3 0 01-6 0v-5a3 3 0 013-3zM11 17a6 6 0 0012 0M17 23v3" transform="translate(970,308)" fill="none" stroke="#56625F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1012" y="330" font-size="12.5" font-weight="500" fill="#14201F" text-anchor="start">voice note 0:42</text><text x="256" y="388" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">Add: note · link · screenshot · file · voice · ticket · paste a folder</text><line x1="256" y1="404" x2="1224" y2="404" stroke="#DDD7CA"/><rect x="256" y="418" width="158.82500000000002" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><circle cx="267" cy="429" r="4" fill="#276B2A"/><text x="277" y="433" font-size="11.5" font-weight="500" fill="#276B2A" text-anchor="start">Stays on this machine</text><rect x="436" y="418" width="209.425" height="22" rx="11" fill="#E2EAFB" stroke="none" stroke-width="0"/><circle cx="447" cy="429" r="4" fill="#1F4FB8"/><text x="457" y="433" font-size="11.5" font-weight="500" fill="#1F4FB8" text-anchor="start">Nothing is decided by feeding</text><rect x="1006" y="414" width="90" height="34" rx="8" fill="#FFFFFF" stroke="#B9CBC6" stroke-width="1"/><text x="1051.0" y="435.5" font-size="13" font-weight="600" fill="#14201F" text-anchor="middle">Keep as is</text><rect x="1106" y="414" width="126" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1169.0" y="435.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Feed it</text><text x="230" y="490" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">WHAT HAPPENS NEXT</text><rect x="230" y="504" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="244" y="518" width="26" height="26" rx="13" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="257" y="536" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">1</text><text x="244" y="566" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">KILN keeps it exactly as you gave it, with</text><text x="244" y="584" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">the time and where it came from.</text><rect x="570" y="504" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="584" y="518" width="26" height="26" rx="13" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="597" y="536" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">2</text><text x="584" y="566" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">The planner reads it and proposes where it</text><text x="584" y="584" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">belongs — a draft, labelled as one.</text><rect x="910" y="504" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="924" y="518" width="26" height="26" rx="13" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="937" y="536" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">3</text><text x="924" y="566" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">You see the proposal in Feed. You decide, or</text><text x="924" y="584" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">leave it. Nothing waits on you.</text><text x="230" y="640" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">RECENTLY FED</text><rect x="230" y="654" width="1020" height="42" rx="10" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="250" y="680" font-size="13.5" font-weight="500" fill="#14201F" text-anchor="start">Retry limits should be a setting, not a constant</text><text x="1236" y="680" font-size="12" font-weight="400" fill="#276B2A" text-anchor="end">yesterday · sorted → Knowledge</text><rect x="230" y="704" width="1020" height="42" rx="10" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="250" y="730" font-size="13.5" font-weight="500" fill="#14201F" text-anchor="start">Article on idempotency keys</text><text x="1236" y="730" font-size="12" font-weight="400" fill="#56625F" text-anchor="end">2 days ago · kept as a note</text><rect x="230" y="754" width="1020" height="42" rx="10" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="250" y="780" font-size="13.5" font-weight="500" fill="#14201F" text-anchor="start">legacy-export-spec.pdf</text><text x="1236" y="780" font-size="12" font-weight="400" fill="#8A4B04" text-anchor="end">3 days ago · waiting for you</text></svg>