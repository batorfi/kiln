<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Fed things keep their trail</title><desc id="d">A gate brief and a roadmap each showing a fed item with a 'from your feed' origin that links back to the original.</desc><rect width="1280" height="820" fill="#F4F1EA"/><rect x="0" y="0" width="200" height="820" fill="#14201F"/><text x="18" y="34" font-size="17" font-weight="700" fill="#E9EFEC" text-anchor="start">KILN</text><text x="18" y="52" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">Workshop · this machine</text><rect x="8" y="67" width="184" height="28" rx="6" fill="#1B3331"/><rect x="8" y="67" width="3" height="28" fill="#0F766E"/><text x="22" y="84" font-size="13" font-weight="600" fill="#E9EFEC" text-anchor="start">Needs you</text><rect x="150" y="70" width="30" height="20" rx="10" fill="#0F766E" stroke="none" stroke-width="0"/><text x="165" y="84" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="22" y="114" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Feed</text><rect x="150" y="100" width="30" height="20" rx="10" fill="#27403D" stroke="none" stroke-width="0"/><text x="165" y="114" font-size="11.5" font-weight="700" fill="#E9EFEC" text-anchor="middle">4</text><text x="22" y="144" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Factories</text><text x="22" y="174" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Team space</text><text x="22" y="204" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Record</text><text x="22" y="234" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Knowledge</text><text x="22" y="264" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Bench</text><text x="22" y="294" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Insights</text><text x="22" y="324" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Models &amp; policy</text><text x="18" y="380" font-size="10.5" font-weight="600" fill="#7E948F" text-anchor="start">FACTORIES</text><circle cx="24" cy="400" r="4.5" fill="#86D08A"/><text x="36" y="404" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">orders-api</text><text x="182" y="404" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">working</text><circle cx="24" cy="426" r="4.5" fill="#F2B24A"/><text x="36" y="430" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">billing</text><text x="182" y="430" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">waiting</text><circle cx="24" cy="452" r="4.5" fill="#8FB0F5"/><text x="36" y="456" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">mobile</text><text x="182" y="456" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">new</text><rect x="10" y="742" width="180" height="64" rx="8" fill="#162B29" stroke="none" stroke-width="0"/><text x="20" y="762" font-size="11" font-weight="600" fill="#B9CBC6" text-anchor="start">This machine</text><text x="20" y="780" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">memory 41 of 64 GB in use</text><rect x="20" y="788" width="160" height="5" rx="2.5" fill="#27403D"/><rect x="20" y="788" width="102" height="5" rx="2.5" fill="#0F766E"/><text x="230" y="40" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">billing › Feature 7 › Code review</text><text x="230" y="76" font-size="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Is the retry change ready to merge?</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">Judged · round 1 · waiting 2 h · nothing is decided yet</text><rect x="1110" y="30" width="140" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1180.0" y="51.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Feed KILN</text><rect x="230" y="122" width="620" height="330" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="250" y="152" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">THE YARDSTICK</text><text x="250" y="180" font-size="15" font-weight="600" fill="#14201F" text-anchor="start">What this work is measured against</text><rect x="250" y="198" width="580" height="50" rx="10" fill="#FAF8F5" stroke="none" stroke-width="0"/><text x="266" y="219" font-size="13.5" font-weight="600" fill="#14201F" text-anchor="start">Specification v2</text><text x="266" y="238" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">approved by you · 9 Oct</text><rect x="250" y="256" width="580" height="50" rx="10" fill="#FAF8F5" stroke="none" stroke-width="0"/><text x="266" y="277" font-size="13.5" font-weight="600" fill="#14201F" text-anchor="start">Constitution 2.1.0 · Principle VI</text><text x="266" y="296" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">pinned</text><rect x="250" y="314" width="580" height="50" rx="10" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="266" y="335" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="start">Your feed · Sunday</text><text x="266" y="354" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">“Retry limits should be a setting, not a constant”</text><rect x="722" y="328" width="106.55000000000001" height="22" rx="11" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="731" y="343" font-size="11.5" font-weight="500" fill="#0F766E" text-anchor="start">from your feed</text><rect x="250" y="372" width="580" height="50" rx="10" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="266" y="393" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="start">Your feed · today</text><text x="266" y="412" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Cart is lost when switching card → invoice</text><rect x="722" y="386" width="106.55000000000001" height="22" rx="11" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="731" y="401" font-size="11.5" font-weight="500" fill="#0F766E" text-anchor="start">from your feed</text><text x="250" y="442" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Fed items are context. The reviewer cites them; they never change a requirement by themselves.</text><rect x="872" y="122" width="378" height="330" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="892" y="152" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">THE EVIDENCE</text><text x="892" y="182" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Judge verdict</text><rect x="892" y="192" width="190.45000000000002" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><circle cx="903" cy="203" r="4" fill="#8A4B04"/><text x="913" y="207" font-size="11.5" font-weight="500" fill="#8A4B04" text-anchor="start">2 findings · none blocking</text><text x="892" y="238" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">“Retry limit is still a constant in retry.ts:41.</text><text x="892" y="257" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">You fed this on Sunday as a wish, not a</text><text x="892" y="276" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">requirement.”</text><text x="892" y="320" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Tests</text><rect x="892" y="330" width="158.82500000000002" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><circle cx="903" cy="341" r="4" fill="#276B2A"/><text x="913" y="345" font-size="11.5" font-weight="500" fill="#276B2A" text-anchor="start">128 passed · 0 failed</text><text x="892" y="384" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Could not run</text><text x="892" y="402" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Staging checkout flow — not available on this</text><text x="892" y="420" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">machine.</text><text x="230" y="490" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">IN THE ROADMAP</text><rect x="230" y="504" width="1020" height="270" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="250" y="534" font-size="15" font-weight="600" fill="#14201F" text-anchor="start">orders-api · version 3 · proposed</text><rect x="250" y="552" width="980" height="44" rx="10" fill="#FAF8F5" stroke="none" stroke-width="0"/><text x="266" y="579" font-size="13.5" font-weight="500" fill="#14201F" text-anchor="start">Invoice payments</text><rect x="1154.8" y="563" width="68.6" height="22" rx="11" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1163.8" y="578" font-size="11.5" font-weight="500" fill="#56625F" text-anchor="start">from you</text><rect x="250" y="604" width="980" height="44" rx="10" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="266" y="631" font-size="13.5" font-weight="500" fill="#14201F" text-anchor="start">Show progress in onboarding</text><rect x="962.8" y="615" width="258.35" height="22" rx="11" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="971.8" y="630" font-size="11.5" font-weight="500" fill="#0F766E" text-anchor="start">from your feed · voice note, last week</text><rect x="250" y="656" width="980" height="44" rx="10" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="266" y="683" font-size="13.5" font-weight="500" fill="#14201F" text-anchor="start">Retry limits as a setting</text><rect x="1020.4000000000001" y="667" width="201.425" height="22" rx="11" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1029.4" y="682" font-size="11.5" font-weight="500" fill="#0F766E" text-anchor="start">from your feed · note, Sunday</text><rect x="250" y="708" width="980" height="44" rx="10" fill="#FAF8F5" stroke="none" stroke-width="0"/><text x="266" y="735" font-size="13.5" font-weight="500" fill="#14201F" text-anchor="start">Export to CSV</text><rect x="1103.6" y="719" width="119.2" height="22" rx="11" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1112.6" y="734" font-size="11.5" font-weight="500" fill="#56625F" text-anchor="start">from the planner</text></svg>