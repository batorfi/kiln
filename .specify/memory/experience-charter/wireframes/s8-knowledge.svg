<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S8 Knowledge — wireframe</title><desc id="d">find, read and ask the factory's knowledge, with citations and honest flags. Regions: S8.R1 Page header and ask; S8.R2 Pages; S8.R3 Page; S8.R4 Answer; S8.R5 Findings.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666"