<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S1 Workshop overview — wireframe</title><desc id="d">the home screen: what needs me now, what changed, and where every factory stands. Regions: S1.R1 Page header; S1.R2 Needs you now; S1.R3 While you were away; S1.R4 Factories; S1.R5 Legend.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="226" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="70" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S1.R1  Page header</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Sentence heading: “3 decisions are waiting for you”</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">context: who is stopped, who is working, “nothing is wrong” · chips: local by default · last activity</text><rect x="1204.6" y="56" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="69" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X4 · X5</text><rect x="215" y="90" width="640" height="330" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="227" y="205" width="616" height="62" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="219" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">gate card</text><rect x="227" y="275" width="616" height="62" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="289" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">gate card</text><rect x="227" y="345" width="616" height="62" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="359" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">gate card</text><text x="225" y="108" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S1.R2  Needs you now</text><text x="225" y="126" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Gate cards: judged gates first, then oldest</text><text x="225" y="140" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">each: gate · factory · feature · the gate's question · evidence chips</text><text x="225" y="154" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">(judge verdict, moves available) · how long it has waited</text><text x="225" y="168" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">“Open gate brief” — never a decision on this screen</text><rect x="702.8" y="396" width="144.20000000000002" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="774.9" y="409" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X2 · X3 · J1.1 · J1.2</text><rect x="865" y="90" width="405" height="330" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="875" y="108" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S1.R3  While you were away</text><text x="875" y="126" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Worth knowing, newest first, one line each:</text><text x="875" y="140" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">recovered after a crash · delegation stopped</text><text x="875" y="154" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">overlap detected · blocked by policy</text><text x="875" y="168" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">each names the actor and the factory</text><rect x="1161.2" y="396" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1211.6" y="409" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · X6 · J2.2</text><rect x="215" y="430" width="1055" height="290" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="227" y="480" width="335" height="230" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="494" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">factory card</text><rect x="572" y="480" width="335" height="230" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="578" y="494" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">factory card</text><rect x="917" y="480" width="341" height="230" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="923" y="494" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">factory card</text><text x="225" y="448" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S1.R4  Factories</text><text x="225" y="466" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">One card per factory: name · locality chip (local-only · hybrid) · feature and state in words</text><text x="225" y="480" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">gate rail · runs on · roadmap progress · lane · today's machine time and swaps</text><rect x="1204.6" y="696" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="709" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X4 · X8</text><rect x="215" y="730" width="1055" height="80" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="748" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S1.R5  Legend</text><text x="225" y="766" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">decided by a human · passed under delegation · waiting for you · working</text><text x="225" y="780" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">skipped by triage · not applicable — each a word and a shape, never colour alone</text><rect x="1204.6" y="786" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="799" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X5</text></svg>
