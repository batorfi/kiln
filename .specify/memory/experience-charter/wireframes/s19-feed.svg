<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S19 Feed — wireframe</title><desc id="d">everything the person fed KILN, with KILN's drafted destinations — the person decides. Regions: S19.R1 Page header and Feed KILN; S19.R2 Filters; S19.R3 Fed items; S19.R4 Rule of the Feed.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="226" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="100" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S19.R1  Page header and Feed KILN</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Sentence heading: “4 things you fed are sorted and waiting for your say”</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">context: nothing here blocks any factory · primary action: Feed KILN (drop anything)</text><rect x="1155.0" y="86" width="107.0" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1208.5" y="99" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X2 · X7 · J13.1</text><rect x="215" y="120" width="1055" height="50" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="138" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S19.R2  Filters</text><text x="225" y="156" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">All · Waiting for you · Kept as notes · Done · filter by factory · newest first</text><rect x="1235.6" y="146" width="26.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1248.8" y="159" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X7</text><rect x="215" y="180" width="1055" height="500" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="227" y="235" width="1031" height="90" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="249" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><rect x="227" y="335" width="1031" height="90" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="349" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><rect x="227" y="435" width="1031" height="90" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="449" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><rect x="227" y="535" width="1031" height="90" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="549" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><text x="225" y="198" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S19.R3  Fed items</text><text x="225" y="216" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">One row per item: kind icon · gist · source and time · state in words</text><text x="225" y="230" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">KILN's drafted destinations as text marked → (never controls, never selected) · Open</text><rect x="1124.0" y="656" width="138.0" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1193.0" y="669" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X5 · X9 · J13.2</text><rect x="215" y="690" width="1055" height="120" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="708" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S19.R4  Rule of the Feed</text><text x="225" y="726" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Feeding decides nothing · the original is kept as given · proposals are drafts by the planner</text><text x="225" y="740" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">waiting never escalates · every use of an item shows “from your feed” and links back</text><rect x="1155.0" y="786" width="107.0" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1208.5" y="799" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X8 · J13.4</text></svg>
