<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S7 Roadmap — wireframe</title><desc id="d">shape the roadmap with the planner and decide at the Roadmap gate. Regions: S7.R1 Page header; S7.R2 Your inputs; S7.R3 The planner asks; S7.R4 The roadmap, shaped together; S7.R5 Journey coverage; S7.R6 Flow per feature; S7.R7 How the factory runs; S7.R8 Moves.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Factories · Team space ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="70" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R1  Page header</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">The gate's question as the heading: “Which features do we build, in what order?”</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">context: proposed version vN · checked · compare versions · chips: waiting for you</text><rect x="1204.6" y="56" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="69" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X4 · X3</text><rect x="215" y="90" width="520" height="200" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="108" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R2  Your inputs</text><text x="225" y="126" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">The roadmap brief the planner reads first: goals · must-haves · constraints</text><text x="225" y="140" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">order preferences · your own features · pointers · add an input</text><rect x="657.2" y="266" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="692.1" y="279" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X9 · J3.1</text><rect x="215" y="300" width="520" height="130" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="318" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R3  The planner asks</text><text x="225" y="336" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Questions where inputs are thin or in tension, with choices</text><text x="225" y="350" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">and “answer in my words” — your answer joins the brief</text><rect x="657.2" y="406" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="692.1" y="419" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X9 · J3.2</text><rect x="745" y="90" width="525" height="330" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="757" y="190" width="501" height="52" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="763" y="204" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">feature</text><rect x="757" y="250" width="501" height="52" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="763" y="264" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">feature</text><rect x="757" y="310" width="501" height="52" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="763" y="324" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">feature</text><text x="755" y="108" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R4  The roadmap, shaped together</text><text x="755" y="126" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Features in order, each with its origin (from you · planner · candidate · team),</text><text x="755" y="140" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">readiness (ready · thin · unknown), pins, and suggestions shown as not applied</text><text x="755" y="154" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">ask for an alternative · edit features · every version checked</text><rect x="1161.2" y="396" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1211.6" y="409" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · X9 · J3.3</text><rect x="215" y="440" width="520" height="180" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="458" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R5  Journey coverage</text><text x="225" y="476" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Charter journeys against the features: complete · partial · none · deferred</text><text x="225" y="490" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">five deterministic checks, shown as gaps — never blocking</text><rect x="626.2" y="596" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="676.6" y="609" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · X5 · J3.4</text><rect x="745" y="430" width="525" height="190" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="755" y="448" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R6  Flow per feature</text><text x="755" y="466" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Which gates apply to each feature and why — Experience design and UI review</text><text x="755" y="480" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">applies / not applicable · team-required gates, not declinable</text><rect x="1192.2" y="596" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1227.1" y="609" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · J3.4</text><rect x="215" y="630" width="520" height="160" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="648" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R7  How the factory runs</text><text x="225" y="666" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">profile · egress policy · budget · host with its fit — decided here, visibly</text><rect x="669.6" y="766" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="698.3" y="779" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · X5</text><rect x="745" y="630" width="525" height="160" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="757" y="730" width="150" height="40" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="763" y="744" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">move</text><rect x="917" y="730" width="150" height="40" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="923" y="744" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">move</text><rect x="1077" y="730" width="181" height="40" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="1083" y="744" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">move</text><text x="755" y="648" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S7.R8  Moves</text><text x="755" y="666" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">approve · revise · reject · edit, add or drop features</text><text x="755" y="680" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">applies to exactly the version you read · no move pre-selected</text><rect x="1192.2" y="766" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1227.1" y="779" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · J3.5</text></svg>
