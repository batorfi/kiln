<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S0 The frame — wireframe</title><desc id="d">the frame every screen shares: where am I, what needs me, where can I go. Regions: S0.C Content area.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Factories · Team space ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="800" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S0.C  Content area</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Every screen's content starts with the page header (R1 of that screen):</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">breadcrumb · a plain-sentence heading · one line of context · status chips.</text><text x="225" y="74" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start"></text><text x="225" y="88" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">The frame never changes between screens, so the human is always oriented.</text><text x="225" y="102" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Needs you (count) is the first navigation item and is visible from every screen.</text><text x="225" y="116" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">A factory's state is one word and one shape in the rail, from anywhere.</text><rect x="1204.6" y="786" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="799" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X4 · X7</text></svg>
