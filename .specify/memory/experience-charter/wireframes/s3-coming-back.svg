<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S3 Coming back — wireframe</title><desc id="d">the account after time away or a crash: what happened, that nothing was decided for you, and what needs you. Regions: S3.R1 Page header; S3.R2 Recovery; S3.R3 Nothing was approved; S3.R4 By factory; S3.R5 What needs you now; S3.R6 Timeline.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="226" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="62" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S3.R1  Page header</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Sentence heading: “Welcome back — here is what happened while you were away”</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">context: since you left at … · how long · last activity</text><rect x="1235.6" y="48" width="26.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1248.8" y="61" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X6</text><rect x="215" y="80" width="1055" height="190" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="227" y="140" width="336" height="120" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="154" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">in flight</text><rect x="574" y="140" width="336" height="120" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="580" y="154" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">resumed</text><rect x="921" y="140" width="337" height="120" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="927" y="154" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">kept waiting</text><text x="225" y="98" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S3.R2  Recovery</text><text x="225" y="116" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">“Recovered after a crash” when it happened — time and what resumed</text><text x="225" y="130" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">three cards: in flight · resumed · kept waiting</text><rect x="1204.6" y="246" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="259" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · X6</text><rect x="215" y="280" width="1055" height="46" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="298" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S3.R3  Nothing was approved</text><text x="225" y="316" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">“Nothing was approved by the restart. Every gate that was waiting is still waiting for you.”</text><rect x="1204.6" y="302" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="315" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X6</text><rect x="215" y="336" width="520" height="454" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="354" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S3.R4  By factory</text><text x="225" y="372" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Table: factory (locality chip) · while you were away · now · cost</text><text x="225" y="386" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">delegated passes, rejections that ended a delegation,</text><text x="225" y="400" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">blocked requests — named, never smoothed over</text><rect x="626.2" y="766" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="676.6" y="779" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · X8 · J5.4</text><rect x="745" y="336" width="525" height="200" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="755" y="354" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S3.R5  What needs you now</text><text x="755" y="372" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Numbered, suggested order — your choice</text><text x="755" y="386" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">judged gates first, then waited longest</text><text x="755" y="400" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">“Why this order” stated; waiting never decides anything</text><rect x="1192.2" y="512" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1227.1" y="525" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X2 · J2.4</text><rect x="745" y="546" width="525" height="244" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="755" y="564" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S3.R6  Timeline</text><text x="755" y="582" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Time-stamped lines from the record, oldest first</text><text x="755" y="596" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">crash · overlap · delegation · rejection · resume</text><rect x="1235.6" y="766" width="26.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1248.8" y="779" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X8</text></svg>
