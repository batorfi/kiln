nchor="start">S4.R4  The running step</text><text x="225" y="266" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Live, as it happens: what the step reads, writes and runs</text><text x="225" y="280" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">role · model · locality chips · “lane held” on judged steps</text><text x="225" y="294" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">what you see is what is recorded — no live-only truth</text><rect x="806.2" y="626" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="856.6" y="639" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · X8 · J4.1</text><rect x="925" y="230" width="345" height="200" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="935" y="248" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S4.R5  Step in</text><text x="935" y="266" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Steer this step (never a judge) · Pause after this</text><text x="935" y="280" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">step</text><text x="935" y="294" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Abort this step · End the delegation</text><text x="935" y="308" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">recorded under your name · none of these decides a</text><text x="935" y="322" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">gate</text><rect x="1117.8" y="406" width="144.20000000000002" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1189.9" y="419" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X9 · J4.2 · J4.4</text><rect x="925" y="440" width="345" height="210" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="935" y="458" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S4.R6  Up next</text><text x="935" y="476" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">One step at a time: what runs next, which gate</text><text x="935" y="490" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">follows,</text><text x="935" y="504" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">which stops for you, which model loads (swap or not)</text><rect x="1161.2" y="626" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1211.6" y="639" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X4 · X8 · J1.7</text><rect x="215" y="660" width="1055" height="150" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="678" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S4.R7  This feature so far</text><text x="225" y="696" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">machine time · swaps · spend against the budget</text><text x="225" y="710" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">what left the machine (requests, size, rule) · blocked requests</text><rect x="1192.2" y="786" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1227.1" y="799" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · J4.5</text></svg>
