<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S2 Needs you — wireframe</title><desc id="d">everything waiting on one person, across factories, the workshop and the team space. Regions: S2.R1 Page header; S2.R2 Waiting on you; S2.R3 Suggestions; S2.R4 Worth knowing; S2.R5 What Needs you never does.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="226" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="80" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S2.R1  Page header</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Sentence heading: “4 things are waiting on you”</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">filters: factory · kind · order (stakes, blocking others, waited) · sort is a convenience only</text><rect x="1204.6" y="66" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="79" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X2 · X7</text><rect x="215" y="100" width="1055" height="330" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="227" y="150" width="1031" height="62" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="164" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><rect x="227" y="220" width="1031" height="62" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="234" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><rect x="227" y="290" width="1031" height="62" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="304" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><rect x="227" y="360" width="1031" height="62" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="374" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">item</text><text x="225" y="118" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S2.R2  Waiting on you</text><text x="225" y="136" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Blocking items: gates, the Roadmap gate, risky actions, policy stops,</text><text x="225" y="150" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">questions from steps, required reviews, team votes</text><text x="225" y="164" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">each shows its headline: kind · question · evidence · waited · what it blocks · Open</text><rect x="1117.8" y="406" width="144.20000000000002" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1189.9" y="419" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X2 · X3 · J1.1 · J4.3</text><rect x="215" y="440" width="520" height="250" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="458" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S2.R3  Suggestions</text><text x="225" y="476" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Nothing is stopped: research, promotion, opinion requests</text><text x="225" y="490" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">never interrupts · act if you want · or dismiss</text><rect x="669.6" y="666" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="698.3" y="679" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X2 · X7</text><rect x="745" y="440" width="525" height="250" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="755" y="458" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S2.R4  Worth knowing</text><text x="755" y="476" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">No action needed: corrections flagged, delegations ended,</text><text x="755" y="490" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">overlaps, recoveries, things shared</text><rect x="1204.6" y="666" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="679" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · X7</text><rect x="215" y="700" width="1055" height="110" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="718" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S2.R5  What Needs you never does</text><text x="225" y="736" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Notifies only for items waiting on you (judged gates and policy stops in focus mode)</text><text x="225" y="750" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">never decides, approves or expires anything · never shows an item it cannot back with a full brief</text><text x="225" y="764" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">waiting never escalates and never times out</text><rect x="1204.6" y="786" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="799" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X7</text></svg>
