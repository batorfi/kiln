-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S11.R3  What KILN found</text><text x="935" y="126" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Measured, not assumed: ✓ present · ✗ missing and what</text><text x="935" y="140" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">to do</text><text x="935" y="154" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">KILN never installs system software</text><rect x="1161.2" y="366" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1211.6" y="379" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · X8 · J7.1</text><rect x="925" y="400" width="345" height="190" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="935" y="418" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S11.R4  What stays local</text><text x="935" y="436" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Nothing leaves the machine · files written · time so</text><text x="935" y="450" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">far</text><rect x="1235.6" y="566" width="26.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1248.8" y="579" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5</text><rect x="215" y="600" width="1055" height="80" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="618" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S11.R5  Step bar</text><text x="225" y="636" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Back · Continue · re-run any step later (kiln init --step) · stop and resume</text><rect x="1204.6" y="656