<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S11 First run — wireframe</title><desc id="d">setup in the browser, step by step, from the machine to the first Roadmap gate. Regions: S11.R1 Page header; S11.R2 This step; S11.R3 What KILN found; S11.R4 What stays local; S11.R5 Step bar; S11.R6 See a whole feature first.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Setup</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · setup · this host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Setup steps</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Machine · Models ·</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Workshop &amp; storage</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">First factory (+</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">constitution, charter,</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">design system) · Knowledge</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">First roadmap · Team</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(optional)</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each step: done · current</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">· optional</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Reassurance</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">everything stays on this</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">machine;</text><text x="16" y="800" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">stop and resume at any</text><text x="16" y="814" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">time</text><rect x="215" y="10" width="1055" height="70" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S11.R1  Page header</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">breadcrumb: step n of 6 · a plain heading for the step</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">one sentence saying what this step decides</text><rect x="1204.6" y="56" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="69" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X4 · X7</text><rect x="215" y="90" width="700" height