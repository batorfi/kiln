<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S9 Models &amp; policy — wireframe</title><desc id="d">where models run, what may leave the machine, and what may be spent — and that it is enforced. Regions: S9.R1 Page header; S9.R2 Where things run; S9.R3 Roles and models; S9.R4 Budgets and spend; S9.R5 Model catalog and checks; S9.R6 Changes.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="226" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="70" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S9.R1  Page header</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Sentence heading: “Where your models run, and what may leave”</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">context: profile per factory · chips: local by default</text><rect x="1235.6" y="56" width="26.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1248.8" y="69" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5</text><rect x="215" y="90" width="520" height="230" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="108" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S9.R2  Where things run</text><text x="225" y="126" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Per factory: profile (local-only · hybrid) · egress rules</text><text x="225" y="140" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">what may leave, for which role, under which rule · blocked requests so far</text><rect x="626.2" y="296" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="676.6" y="309" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · X8 · J9.1</text><rect x="745" y="90" width="525" height="230" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="755" y="108" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S9.R3  Roles and models</text><text x="755" y="126" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Role → model map; judges pinned to the strongest model</text><text x="755" y="140" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">a weaker judge binding shown as a refused configuration, with why</text><rect x="1161.2" y="296" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1211.6" y="309" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X5 · J9.2</text><rect x="215" y="330" width="520" height="200" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="348" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S9.R4  Budgets and spend</text><text x="225" y="366" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Per factory: machine time, swaps, spend against budget</text><text x="225" y="380" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">reached budgets are policy stops in Needs you</text><rect x="657.2" y="506" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="692.1" y="519" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5 · J9.3</text><rect x="745" y="330" width="525" height="200" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="755" y="348" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S9.R5  Model catalog and checks</text><text x="755" y="366" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Models, locality, measured fit and capability (for example, can it read images)</text><text x="755" y="380" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">check results with date</text><rect x="1192.2" y="506" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1227.1" y="519" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · J9.2</text><rect x="215" y="540" width="1055" height="250" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="558" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S9.R6  Changes</text><text x="225" y="576" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Every configuration change: what, before → after, who, when</text><text x="225" y="590" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">applies from the next step · recorded</text><rect x="1192.2" y="766" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1227.1" y="779" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X8 · J9.4</text></svg>
