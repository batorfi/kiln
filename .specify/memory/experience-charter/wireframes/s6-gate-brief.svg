<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S6 Gate brief — wireframe</title><desc id="d">the ten-part brief at any gate: enough to decide without digging, and the only place a move is made. Regions: S6.R1 Orientation; S6.R2 The decision; S6.R3 The work; S6.R4 The yardstick; S6.R5 The evidence; S6.R6 Risks and open issues; S6.R7 Provenance; S6.R8 History; S6.R9 The options; S6.R10 Other actions.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="226" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="100" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R1  Orientation</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">The gate's question as the heading · gate name · judged or not · place among the gates</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">gate rail · round (returned after …) · waited · locality · decided so far and by whom</text><rect x="1204.6" y="86" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="99" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X4 · X5</text><rect x="215" y="120" width="650" height="90" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="138" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R2  The decision</text><text x="225" y="156" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">approving commits to · does not commit to · at stake if wrong</text><rect x="787.2" y="186" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="822.1" y="199" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · J1.3</text><rect x="215" y="220" width="650" height="160" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="227" y="290" width="626" height="80" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="304" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">artifact / diff</text><text x="225" y="238" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R3  The work</text><text x="225" y="256" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Plain summary, then the artifact · on a return round: what changed</text><text x="225" y="270" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">and how your previous note was addressed · open full diff or artifact</text><rect x="756.2" y="356" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="806.6" y="369" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · X9 · J1.4</text><rect x="215" y="390" width="650" height="110" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="408" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R4  The yardstick</text><text x="225" y="426" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">What it is measured against: approved artifacts, requirement ↔ work ↔ evidence</text><text x="225" y="440" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">constitution, charter and design-system ids at their pinned versions · knowledge with citations</text><rect x="787.2" y="476" width="69.80000000000001" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="822.1" y="489" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · J1.4</text><rect x="215" y="510" width="650" height="130" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="528" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R5  The evidence</text><text x="225" y="546" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Judge verdict with findings by severity and location · tests and checks</text><text x="225" y="560" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">fix rounds and outcomes · honest about what could not run</text><rect x="756.2" y="616" width="100.8" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="806.6" y="629" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · X5 · J1.4</text><rect x="215" y="650" width="650" height="140" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="668" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R6  Risks and open issues</text><text x="225" y="686" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">assumptions · overlaps · gaps — evidence missing is shown as missing, not passed</text><rect x="830.6" y="766" width="26.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="843.8" y="779" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X5</text><rect x="875" y="650" width="395" height="70" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="885" y="668" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R7  Provenance</text><text x="885" y="686" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">who did this, on which model, where it ran, what you steered</text><rect x="1235.6" y="696" width="26.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1248.8" y="709" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X8</text><rect x="875" y="730" width="395" height="80" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="885" y="748" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R8  History</text><text x="885" y="766" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">earlier rounds · related decisions · delegation state and why</text><text x="885" y="780" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">this gate stopped</text><rect x="1204.6" y="786" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="799" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X8 · X9</text><rect x="875" y="120" width="395" height="330" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="887" y="330" width="180" height="36" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="893" y="344" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">move</text><rect x="1075" y="330" width="183" height="36" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="1081" y="344" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">move</text><rect x="887" y="372" width="371" height="60" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="893" y="386" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">note</text><text x="885" y="138" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R9  The options</text><text x="885" y="156" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Every move this gate has, each with what happens next, how</text><text x="885" y="170" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">far back,</text><text x="885" y="184" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">what is kept and redone, cost · moves not available here, and</text><text x="885" y="198" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">why</text><text x="885" y="212" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">note field (required when sending back — becomes the next</text><text x="885" y="226" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">instruction)</text><text x="885" y="240" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">no move is pre-selected · you decide as &lt;name&gt;, recorded with</text><text x="885" y="254" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">this brief as seen</text><rect x="1043.4" y="426" width="218.6" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1152.7" y="439" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X1 · X3 · X9 · J1.5 · J1.6 · J5.2</text><rect x="875" y="460" width="395" height="180" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="885" y="478" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S6.R10  Other actions</text><text x="885" y="496" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">ask about the work · request more evidence · read deeper</text><text x="885" y="510" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">hand over · leave it waiting — none of these decides the gate</text><rect x="1204.6" y="616" width="57.4" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1233.3" y="629" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X3 · X8</text></svg>
