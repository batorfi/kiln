<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S5 Feature record — wireframe</title><desc id="d">one feature, rebuilt from the record alone: every gate, every decider, every step. Regions: S5.R1 Page header; S5.R2 Totals; S5.R3 Gates; S5.R4 What left the machine; S5.R5 Steps.</desc><rect x="0.5" y="0.5" width="1279" height="819" rx="0" fill="#fff" stroke="#777" stroke-width="1"/><rect x="0" y="0" width="200" height="820" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0"/><rect x="8" y="8" width="184" height="52" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="24" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F1 Workshop and place</text><text x="16" y="40" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">brand · workshop · this</text><text x="16" y="54" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">host</text><rect x="8" y="68" width="184" height="330" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="84" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F2 Navigation</text><text x="16" y="100" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Needs you (count) — always</text><text x="16" y="114" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">first</text><text x="16" y="128" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Feed (count) · Factories ·</text><text x="16" y="142" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Team space</text><text x="16" y="156" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Record</text><text x="16" y="170" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Knowledge · Bench ·</text><text x="16" y="184" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Insights</text><text x="16" y="198" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Models &amp; policy · Agents ·</text><text x="16" y="212" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Flows</text><text x="16" y="226" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">Hosts · Health · People</text><rect x="8" y="406" width="184" height="250" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="422" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F3 Factories</text><text x="16" y="438" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">each factory: state as a</text><text x="16" y="452" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">word</text><text x="16" y="466" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">and a shape — never colour</text><text x="16" y="480" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">alone</text><text x="16" y="494" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">(working · waiting · new)</text><rect x="8" y="740" width="184" height="70" rx="6" fill="#F2F2F2" stroke="#999" stroke-width="1"/><text x="16" y="756" font-size="11" font-weight="bold" fill="#444" font-style="normal" text-anchor="start">F4 Host strip</text><text x="16" y="772" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">this host · memory budget</text><text x="16" y="786" font-size="10" font-weight="normal" fill="#666" font-style="normal" text-anchor="start">in use · resident models</text><rect x="215" y="10" width="1055" height="70" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><text x="225" y="28" font-size="12.5" font-weight="bold" fill="#222" font-style="normal" text-anchor="start">S5.R1  Page header</text><text x="225" y="46" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">Sentence heading: feature title — merged date</text><text x="225" y="60" font-size="11" font-weight="normal" fill="#555" font-style="normal" text-anchor="start">context: “rebuilt from the record alone” · chips: merged · approved by · locality · see as it was at any moment</text><rect x="1198.4" y="56" width="63.6" height="18" rx="9" fill="#fff" stroke="#777" stroke-width="1"/><text x="1230.2" y="69" font-size="10" font-weight="bold" fill="#444" font-style="normal" text-anchor="middle">X8 · X10</text><rect x="215" y="90" width="1055" height="80" rx="6" fill="#F7F7F7" stroke="#888" stroke-width="1.2"/><rect x="227" y="120" width="250" height="40" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="233" y="134" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">figure</text><rect x="487" y="120" width="250" height="40" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="493" y="134" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">figure</text><rect x="747" y="120" width="250" height="40" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="753" y="134" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">figure</text><rect x="1007" y="120" width="251" height="40" rx="4" fill="#fff" stroke="#BBB" stroke-width="1" stroke-dasharray="4 3"/><text x="1013" y="134" font-size="10" font-weight="normal" fill="#999" font-style="italic" text-anchor="start">figure</text><text x="225" y="108" font-size="12.5" font-weight="bold" fill="#