<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S11 First run — sample</title><desc id="d">Hi-fi sample of the setup flow: step four, first factory with constitution, charter and design system.</desc><rect width="1280" height="820" fill="#F4F1EA"/><rect x="0" y="0" width="200" height="820" fill="#10201F"/><g transform="translate(16 14) scale(.5)"><g fill="none" stroke-width="5.5" stroke-linecap="round"><path d="M6 56V34a26 26 0 0 1 52 0v22" stroke="#2B5C57"/><path d="M15 56V35a17 17 0 0 1 34 0v21" stroke="#1E8F84"/><path d="M24 56V36a8 8 0 0 1 16 0v20" stroke="#2DD4BF"/></g><circle cx="32" cy="45" r="4.2" fill="#2DD4BF"/></g><text x="54" y="38" font-size="19" font-weight="700" letter-spacing="3" fill="#E9EFEC" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">KILN</text><text x="16" y="64" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">Setup · this machine</text><text x="20" y="106" font-size="13" font-weight="600" fill="#2DD4BF" text-anchor="start">✓</text><text x="42" y="106" font-size="13" font-weight="400" fill="#E9EFEC" text-anchor="start">Machine</text><text x="20" y="140" font-size="13" font-weight="600" fill="#2DD4BF" text-anchor="start">✓</text><text x="42" y="140" font-size="13" font-weight="400" fill="#E9EFEC" text-anchor="start">Models</text><text x="20" y="174" font-size="13" font-weight="600" fill="#2DD4BF" text-anchor="start">✓</text><text x="42" y="174" font-size="13" font-weight="400" fill="#E9EFEC" text-anchor="start">Workshop &amp; storage</text><rect x="8" y="190" width="184" height="28" rx="6" fill="#1B3331"/><rect x="8" y="190" width="3" height="28" fill="#2DD4BF"/><text x="20" y="208" font-size="13" font-weight="600" fill="#2DD4BF" text-anchor="start">●</text><text x="42" y="208" font-size="13" font-weight="600" fill="#E9EFEC" text-anchor="start">First factory</text><text x="20" y="242" font-size="13" font-weight="600" fill="#7E948F" text-anchor="start">○</text><text x="42" y="242" font-size="13" font-weight="400" fill="#9DB1AC" text-anchor="start">Knowledge</text><text x="20" y="276" font-size="13" font-weight="600" fill="#7E948F" text-anchor="start">○</text><text x="42" y="276" font-size="13" font-weight="400" fill="#9DB1AC" text-anchor="start">First roadmap</text><text x="20" y="310" font-size="13" font-weight="600" fill="#7E948F" text-anchor="start">○</text><text x="42" y="310" font-size="13" font-weight="400" fill="#9DB1AC" text-anchor="start">Team (optional)</text><rect x="10" y="742" width="180" height="64" rx="8" fill="#162B29" stroke="none" stroke-width="0"/><text x="20" y="764" font-size="11.5" font-weight="600" fill="#B9CBC6" text-anchor="start">Everything stays on this</text><text x="20" y="782" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">machine. Stop and resume any time.</text><text x="230" y="40" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Setup › Step 4 of 6</text><text x="230" y="76" font-size="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Set up your first factory</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">A factory is one codebase and the rules it is built under. You can change all of this later.</text><rect x="230" y="118" width="700" height="466" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="144" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THIS STEP</text><rect x="248" y="158" width="664" height="92" rx="12" fill="#FAF8F3" stroke="#7F8985" stroke-width="1"/><circle cx="274" cy="188" r="8" fill="none" stroke="#7F8985" stroke-width="1.6"/><text x="296" y="194" font-size="15" font-weight="700" fill="#14201F" text-anchor="start">Start from the template</text><text x="296" y="216" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">Constitution, charter and design system seeded from KILN's own. You approve each one.</text><rect x="248" y="262" width="664" height="92" rx="12" fill="#FAF8F3" stroke="#7F8985" stroke-width="1"/><circle cx="274" cy="292" r="8" fill="none" stroke="#7F8985" stroke-width="1.6"/><text x="296" y="298" font-size="15" font-weight="700" fill="#14201F" text-anchor="start">Adopt what the repository already has</text><text x="296" y="320" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">Reads existing docs and a design system if present; nothing is overwritten.</text><rect x="248" y="366" width="664" height="92" rx="12" fill="#FAF8F3" stroke="#7F8985" stroke-width="1"/><circle cx="274" cy="396" r="8" fill="none" stroke="#7F8985" stroke-width="1.6"/><text x="296" y="402" font-size="15" font-weight="700" fill="#14201F" text-anchor="start">Start empty</text><text x="296" y="424" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">You write them yourself, later. The first gate will say what is missing.</text><text x="248" y="484" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">Will be written</text><text x="248" y="508" font-size="12" fill="#14201F" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">.specify/memory/constitution.md · experience-charter.md · design-system/</text><text x="248" y="536" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Defaults are shown; nothing is chosen for you.</text><rect x="950" y="118" width="300" height="300" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="968" y="144" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">WHAT KILN FOUND</text><rect x="968" y="156" width="74.275" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="977" y="171" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="992" y="171" font-size="11.5" font-weight="600" fill="#276B2A" text-anchor="start">present</text><text x="1074" y="172" font-size="13" font-weight="500" fill="#14201F" text-anchor="start">git 2.45</text><rect x="968" y="200" width="74.275" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="977" y="215" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="992" y="215" font-size="11.5" font-weight="600" fill="#276B2A" text-anchor="start">present</text><text x="1074" y="216" font-size="13" font-weight="500" fill="#14201F" text-anchor="start">Node 22</text><rect x="968" y="244" width="74.275" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="977" y="259" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="992" y="259" font-size="11.5" font-weight="600" fill="#276B2A" text-anchor="start">present</text><text x="1074" y="260" font-size="13" font-weight="500" fill="#14201F" text-anchor="start">Ollama · 2 models</text><rect x="968" y="288" width="74.275" height="22" rx="11" fill="#FBE3DF" stroke="none" stroke-width="0"/><text x="977" y="303" font-size="10.5" font-weight="700" fill="#A82A1D" text-anchor="start">✕</text><text x="992" y="303" font-size="11.5" font-weight="600" fill="#A82A1D" text-anchor="start">missing</text><text x="1074" y="304" font-size="13" font-weight="500" fill="#14201F" text-anchor="start">Spec Kit</text><text x="968" y="340" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">KILN never installs system software. For</text><text x="968" y="356" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Spec Kit: run `uvx specify init`.</text><rect x="950" y="430" width="300" height="154" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="968" y="456" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">WHAT STAYS LOCAL</text><text x="968" y="470" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Nothing leaves this machine. 3 files</text><text x="968" y="488" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">written so far · 6 minutes in.</text><rect x="230" y="598" width="1020" height="64" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="248" y="614" width="90" height="34" rx="8" fill="#FFFFFF" stroke="#B9CBC6" stroke-width="1"/><text x="293.0" y="635.5" font-size="13" font-weight="600" fill="#14201F" text-anchor="middle">Back</text><rect x="1112" y="614" width="120" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1172.0" y="635.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue</text><text x="380" y="641" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">Re-run any step later with kiln init --step · stop and resume any time</text><rect x="230" y="676" width="1020" height="108" rx="14" fill="#EAF5F2" stroke="#A9D3CC" stroke-width="1"/><text x="250" y="708" font-size="14.5" font-weight="700" fill="#0F766E" text-anchor="start">See a whole feature first</text><text x="250" y="730" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">A demo factory, read-only: every gate, every brief and the record, before you make a real decision.</text><rect x="1060" y="704" width="172" height="34" rx="8" fill="#FFFFFF" stroke="#B9CBC6" stroke-width="1"/><text x="1146.0" y="725.5" font-size="13" font-weight="600" fill="#14201F" text-anchor="middle">Open the demo</text></svg>