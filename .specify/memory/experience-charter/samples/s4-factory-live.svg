o live-only truth.</text><rect x="970" y="256" width="280" height="214" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="988" y="282" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">STEP IN</text><rect x="988" y="298" width="244" height="34" rx="8" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="1110" y="320" font-size="13" font-weight="600" fill="#14201F" text-anchor="middle">Steer this step</text><rect x="988" y="340" width="244" height="34" rx="8" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="1110" y="362" font-size="13" font-weight="600" fill="#14201F" text-anchor="middle">Pause after this step</text><rect x="988" y="382" width="244" height="34" rx="8" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="1110" y="404" font-size="13" font-weight="600" fill="#14201F" text-anchor="middle">Abort this step</text><rect x="988" y="424" width="244" height="34" rx="8" fill="#EFEBE1" stroke="#7F8985" stroke-width="1"/><text x="1110" y="446" font-size="13" font-weight="600" fill="#56625F" text-anchor="middle">End the delegation</text><text x="988" y="462" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">Recorded under your name. None decides a</text><text x="988" y="477" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">gate.</text><rect x="970" y="496" width="280" height="140" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="988" y="522" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">UP NEXT</text><text x="988" y="552" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">Documentation gate</text><text x="988" y="572" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Stops for you. No model swap needed —</text><text x="988" y="588" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">the writer is already resident.</text><rect x="230" y="648" width="1020" height="140" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="674" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THIS FEATURE SO FAR</text><text x="250" y="704" font-size="24" font-weight="700" fill="#14201F" text-anchor="start">3 h 10 min</text><text x="250" y="726" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">machine time</text><text x="500" y="704" font-size="24" font-weight="700" fill="#14201F" text-anchor="start">4</text><text x="500" y="726" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">model swaps</text><text x="750" y="704" font-size="24" font-weight="700" fill="#14201F" text-anchor="start">$0.00</text><text x="750" y="726" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">spend of $5.00 budget</text><text x="1000" y="704" font-size="24" font-weight="700" fill="#14201F" text-anchor="start">0</text><text x="1000" y="726" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">requests left the machine</text></svg>