ze="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Welcome back — here is what happened while you were away</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">You left Friday 17:40 and are back Monday 08:12.</text><rect x="1110" y="30" width="140" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1180.0" y="51.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Feed KILN</text><rect x="230" y="118" width="1020" height="172" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="144" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">RECOVERY</text><rect x="1090" y="126" width="175.47500000000002" height="22" rx="11" fill="#E2EAFB" stroke="none" stroke-width="0"/><text x="1099" y="141" font-size="10.5" font-weight="700" fill="#1F4FB8" text-anchor="start">ⓘ</text><text x="1114" y="141" font-size="11.5" font-weight="600" fill="#1F4FB8" text-anchor="start">Recovered after a crash</text><rect x="248" y="170" width="310" height="104" rx="12" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="264" y="196" font-size="12" font-weight="600" fill="#56625F" text-anchor="start">In flight</text><text x="264" y="224" font-size="22" font-weight="700" fill="#14201F" text-anchor="start">3 steps</text><text x="264" y="246" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">were running when the machine stopped,</text><text x="264" y="262" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Saturday 02:14</text><rect x="578" y="170" width="310" height="104" rx="12" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="594" y="196" font-size="12" font-weight="600" fill="#56625F" text-anchor="start">Resumed</text><text x="594" y="224" font-size="22" font-weight="700" fill="#14201F" text-anchor="start">3 steps</text><text x="594" y="246" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">restarted from their last committed point at</text><text x="594" y="262" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">02:16</text><rect x="908" y="170" width="310" height="104" rx="12" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="924" y="196" font-size="12" font-weight="600" fill="#56625F" text-anchor="start">Kept waiting</text><text x="924" y="224" font-size="22" font-weight="700" fill="#14201F" text-anchor="start">2 gates</text><text x="924" y="246" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">stayed exactly where they were — unchanged</text><rect x="230" y="302" width="1020" height="44" rx="12" fill="#E1F0DC" stroke="#C6DFBD" stroke-width="1"/><rect x="246" y="313" width="156.5" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="255" y="328" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="270" y="328" font-size="11.5" font-weight="600" fill="#276B2A" text-anchor="start">Nothing was approved</text><text x="432" y="330" font-size="13.5" font-weight="500" fill="#276B2A" text-anchor="start">by the restart. Every gate that was waiting is still waiting for you.</text><rect x="230" y="358" width="520" height="430" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="384" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">BY FACTORY</text><text x="250" y="408" font-size="14.5" font-weight="700" fill="#14201F" text-anchor="start">orders-api</text><text x="250" y="428" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">worked 9 h 20 min</text><text x="250" y="446" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">delegated passes: 0 · 4 steps done · $0.00</text><line x1="250" y1="458" x2="730" y2="458" stroke="#DDD7CA"/><text x="250" y="486" font-size="14.5" font-weight="700" fill="#14201F" text-anchor="start">billing</text><text x="250" y="506" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">worked 6 h 05 min</text><text x="250" y="524" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">recovered once · 1 step redone · $1.84 cloud</text><line x1="250" y1="536" x2="730" y2="536" stroke="#DDD7CA"/><text x="250" y="564" font-size="14.5" font-weight="700" fill="#14201F" text-anchor="start">mobile</text><text x="250" y="584" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">idle</text><text x="250" y="602" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">nothing started</text><line x1="250" y1="614" x2="730" y2="614" stroke="#DDD7CA"/><text x="250" y="640" font-size="12" font-weight="600" fill="#56625F" text-anchor="start">Blocked requests</text><text x="250" y="660" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">billing tried a cloud model on invoices/ — refused by the local-only</text><text x="250" y="677" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">rule. Named, not smoothed over.</text><rect x="770" y="358" width="480" height="244" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="788" y="384" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">WHAT NEEDS YOU NOW</text><rect x="786" y="394" width="448" height="52" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="804" y="416" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">1   Code review · billing</text><text x="822" y="434" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">judged, waited longest</text><rect x="786" y="456" width="448" height="52" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="804" y="478" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">2   Roadmap gate · orders-api</text><text x="822" y="496" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">waiting 40 min</text><rect x="786" y="518" width="448" height="52" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="804" y="540" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">3   Policy stop · billing</text><text x="822" y="558" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">one step held</text><text x="786" y="586" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Suggested order. Your choice; waiting decides nothing.</text><rect x="770" y="614" width="480" height="174" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="788" y="640" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">TIMELINE</text><text x="788" y="656" font-size="11.5" fill="#56625F" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">Sat 02:14</text><text x="870" y="656" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Machine stopped; 3 steps in flight</text><text x="788" y="686" font-size="11.5" fill="#56625F" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">Sat 02:16</text><text x="870" y="686" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Resumed from last committed step</text><text x="788" y="716" font-size="11.5" fill="#56625F" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">Sun 11:05</text><text x="870" y="716" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Delegation ended in orders-api (objection)</text><text x="788" y="746" font-size="11.5" fill="#56625F" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">Mon 08:12</text><text x="870" y="746" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">You returned</text></svg>