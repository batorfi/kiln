<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S3 Coming back — sample</title><desc id="d">Hi-fi sample of the return screen: what happened, that nothing was approved, what needs the person now.</desc><rect width="1280" height="820" fill="#F4F1EA"/><rect x="0" y="0" width="200" height="820" fill="#10201F"/><g transform="translate(16 14) scale(.5)"><g fill="none" stroke-width="5.5" stroke-linecap="round"><path d="M6 56V34a26 26 0 0 1 52 0v22" stroke="#2B5C57"/><path d="M15 56V35a17 17 0 0 1 34 0v21" stroke="#1E8F84"/><path d="M24 56V36a8 8 0 0 1 16 0v20" stroke="#2DD4BF"/></g><circle cx="32" cy="45" r="4.2" fill="#2DD4BF"/></g><text x="54" y="38" font-size="19" font-weight="700" letter-spacing="3" fill="#E9EFEC" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">KILN</text><text x="16" y="64" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">Workshop · this machine</text><rect x="8" y="83" width="184" height="28" rx="6" fill="#1B3331"/><rect x="8" y="83" width="3" height="28" fill="#2DD4BF"/><text x="22" y="100" font-size="13" font-weight="600" fill="#E9EFEC" text-anchor="start">Needs you</text><rect x="150" y="86" width="30" height="20" rx="10" fill="#0F766E" stroke="none" stroke-width="0"/><text x="165" y="100" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="22" y="130" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Feed</text><rect x="150" y="116" width="30" height="20" rx="10" fill="#27403D" stroke="none" stroke-width="0"/><text x="165" y="130" font-size="11.5" font-weight="700" fill="#E9EFEC" text-anchor="middle">4</text><text x="22" y="160" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Factories</text><text x="22" y="190" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Team space</text><text x="22"