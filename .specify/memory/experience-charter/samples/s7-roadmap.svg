<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S7 Roadmap — sample</title><desc id="d">Hi-fi sample of the Roadmap gate: inputs, planner questions, roadmap shaped together, coverage, moves.</desc><rect width="1280" height="820" fill="#F4F1EA"/><rect x="0" y="0" width="200" height="820" fill="#10201F"/><g transform="translate(16 14) scale(.5)"><g fill="none" stroke-width="5.5" stroke-linecap="round"><path d="M6 56V34a26 26 0 0 1 52 0v22" stroke="#2B5C57"/><path d="M15 56V35a17 17 0 0 1 34 0v21" stroke="#1E8F84"/><path d="M24 56V36a8 8 0 0 1 16 0v20" stroke="#2DD4BF"/></g><circle cx="32" cy="45" r="4.2" fill="#2DD4BF"/></g><text x="54" y="38" font-size="19" font-weight="700" letter-spacing="3" fill="#E9EFEC" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">KILN</text><text x="16" y="64" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">Workshop · this machine</text><text x="22" y="100" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Needs you</text><rect x="150" y="86" width="30" height="20" rx="10" fill="#0F766E" stroke="none" stroke-width="0"/><text x="165" y="100" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="22" y="130" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Feed</text><rect x="150" y="116" width="30" height="20" rx="10" fill="#27403D" stroke="none" stroke-width="0"/><text x="165" y="130" font-size="11.5" font-weight="700" fill="#E9EFEC" text-anchor="middle">4</text><rect x="8" y="143" width="184" height="28" rx="6" fill="#1B3331"/><rect x="8" y="143" width="3" height="28" fill="#2DD4BF"/><text x="22" y="160" font-size="13" font-weight="600" fill="#E9EFEC" text-anchor="start">Factories</text><text x="22" y="190" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Team space</text><text x="22" y="220" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Record</text><text x="22" y="250" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Knowledge</text><text x="22" y="280" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Bench</text><text x="22" y="310" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Insights</text><text x="22" y="340" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Models &amp; policy</text><text x="18" y="392" font-size="10.5" font-weight="600" fill="#7E948F" text-anchor="start">FACTORIES</text><circle cx="24" cy="412" r="4.5" fill="#86D08A"/><text x="36" y="416" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">orders-api</text><text x="182" y="416" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">working</text><circle cx="24" cy="438" r="4.5" fill="#F2B24A"/><text x="36" y="442" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">billing</text><text x="182" y="442" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">waiting</text><circle cx="24" cy="464" r="4.5" fill="#8FB0F5"/><text x="36" y="468" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">mobile</text><text x="182" y="468" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">new</text><rect x="10" y="742" width="180" height="64" rx="8" fill="#162B29" stroke="none" stroke-width="0"/><text x="20" y="762" font-size="11" font-weight="600" fill="#B9CBC6" text-anchor="start">This machine</text><text x="20" y="780" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">memory 41 of 64 GB in use</text><rect x="20" y="788" width="160" height="5" rx="2.5" fill="#27403D"/><rect x="20" y="788" width="102" height="5" rx="2.5" fill="#2DD4BF"/><text x="230" y="40" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">orders-api › Roadmap</text><text x="230" y="76" font-size="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Which features do we build, in what order?</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">Proposed version 3 · checked · compare with version 2</text><rect x="1110" y="30" width="140" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1180.0" y="51.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Feed KILN</text><rect x="1010" y="72" width="124.87500000000001" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="1019" y="87" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="start">●</text><text x="1034" y="87" font-size="11.5" font-weight="600" fill="#8A4B04" text-anchor="start">Waiting for you</text><rect x="230" y="124" width="500" height="190" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="150" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">YOUR INPUTS</text><text x="248" y="166" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">• Goal: customers can pay by invoice</text><text x="248" y="194" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">• Must have: retry limits as a setting</text><text x="248" y="222" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">• Constraint: no new cloud dependency</text><text x="248" y="250" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">• Order: onboarding progress before CSV export</text><text x="248" y="296" font-size="12.5" font-weight="600" fill="#0F766E" text-anchor="start">+ Add an input</text><rect x="230" y="326" width="500" height="130" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="352" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THE PLANNER ASKS</text><text x="248" y="366" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">Invoice payments and card checkout both touch the cart. Which comes</text><text x="248" y="384" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">first?</text><rect x="248" y="400" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="318" y="420" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="middle">Invoices first</text><rect x="398" y="400" width="120" height="32" rx="8" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="458" y="420" font-size="12.5" font-weight="600" fill="#14201F" text-anchor="middle">Cards first</text><text x="534" y="420" font-size="12.5" font-weight="600" fill="#0F766E" text-anchor="start">Answer in my words</text><rect x="750" y="124" width="500" height="332" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="768" y="150" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THE ROADMAP, SHAPED TOGETHER</text><rect x="766" y="158" width="468" height="46" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="782" y="178" font-size="13.5" font-weight="600" fill="#14201F" text-anchor="start">1  Invoice payments</text><rect x="782" y="183" width="64.2" height="22" rx="11" fill="#EFEBE1" stroke="none" stroke-width="0"/><text x="791" y="198" font-size="10.5" font-weight="500" fill="#56625F" text-anchor="start">from you</text><rect x="1144" y="170" width="60.25" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="1153" y="185" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="1168" y="185" font-size="11" font-weight="600" fill="#276B2A" text-anchor="start">ready</text><rect x="766" y="212" width="468" height="46" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="782" y="232" font-size="13.5" font-weight="600" fill="#14201F" text-anchor="start">2  Retry limits as a setting</text><rect x="782" y="237" width="98.85000000000001" height="22" rx="11" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="791" y="252" font-size="10.5" font-weight="500" fill="#0F766E" text-anchor="start">from your feed</text><rect x="1144" y="224" width="60.25" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="1153" y="239" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="1168" y="239" font-size="11" font-weight="600" fill="#276B2A" text-anchor="start">ready</text><rect x="766" y="266" width="468" height="46" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="782" y="286" font-size="13.5" font-weight="600" fill="#14201F" text-anchor="start">3  Show progress in onboarding</text><rect x="782" y="291" width="98.85000000000001" height="22" rx="11" fill="#DCEEEA" stroke="none" stroke-width="0"/><text x="791" y="306" font-size="10.5" font-weight="500" fill="#0F766E" text-anchor="start">from your feed</text><rect x="1144" y="278" width="54.2" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="1153" y="293" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="start">●</text><text x="1168" y="293" font-size="11" font-weight="600" fill="#8A4B04" text-anchor="start">thin</text><rect x="766" y="320" width="468" height="46" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="782" y="340" font-size="13.5" font-weight="600" fill="#14201F" text-anchor="start">4  Offline cart</text><rect x="782" y="345" width="110.4" height="22" rx="11" fill="#EFEBE1" stroke="none" stroke-width="0"/><text x="791" y="360" font-size="10.5" font-weight="500" fill="#56625F" text-anchor="start">from the planner</text><rect x="1144" y="332" width="72.35" height="22" rx="11" fill="#EAE5DA" stroke="none" stroke-width="0"/><text x="1153" y="347" font-size="10.5" font-weight="700" fill="#56625F" text-anchor="start">–</text><text x="1168" y="347" font-size="11" font-weight="600" fill="#56625F" text-anchor="start">unknown</text><rect x="766" y="374" width="468" height="46" rx="10" fill="#FAF8F3" stroke="#DDD7CA" stroke-width="1"/><text x="782" y="394" font-size="13.5" font-weight="600" fill="#14201F" text-anchor="start">5  Export to CSV</text><rect x="782" y="399" width="110.4" height="22" rx="11" fill="#EFEBE1" stroke="none" stroke-width="0"/><text x="791" y="414" font-size="10.5" font-weight="500" fill="#56625F" text-anchor="start">from the planner</text><rect x="1144" y="386" width="60.25" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="1153" y="401" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="1168" y="401" font-size="11" font-weight="600" fill="#276B2A" text-anchor="start">ready</text><rect x="230" y="468" width="500" height="160" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="494" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">JOURNEY COVERAGE</text><text x="248" y="510" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">J1 Decide at a gate</text><rect x="520" y="495" width="80.6" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="529" y="510" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="544" y="510" font-size="11.5" font-weight="600" fill="#276B2A" text-anchor="start">complete</text><text x="248" y="544" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">J3 Shape the roadmap</text><rect x="520" y="529" width="74.275" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="529" y="544" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="start">●</text><text x="544" y="544" font-size="11.5" font-weight="600" fill="#8A4B04" text-anchor="start">partial</text><text x="248" y="578" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">J10 Ask the knowledge</text><rect x="520" y="563" width="80.6" height="22" rx="11" fill="#EAE5DA" stroke="none" stroke-width="0"/><text x="529" y="578" font-size="10.5" font-weight="700" fill="#56625F" text-anchor="start">–</text><text x="544" y="578" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">deferred</text><text x="248" y="614" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">5 checks · 1 gap shown · never blocking</text><rect x="750" y="468" width="500" height="160" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="768" y="494" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">FLOW PER FEATURE</text><text x="768" y="508" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Experience design and UI review apply to Invoice payments and Show</text><text x="768" y="526" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">progress (they touch the interface). Not applicable to Retry limits</text><text x="768" y="544" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">and Export to CSV — recorded as such.</text><rect x="230" y="640" width="500" height="148" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="666" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">HOW THE FACTORY RUNS</text><text x="248" y="680" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Profile local-only · egress none · budget $5.00 · host studio-m5 (fit:</text><text x="248" y="698" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">measured, 41 of 64 GB).</text><rect x="750" y="640" width="500" height="148" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="768" y="666" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">MOVES</text><text x="768" y="678" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">Applies to exactly version 3, as you read it.</text><rect x="768" y="700" width="142" height="40" rx="10" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="839" y="725" font-size="13.5" font-weight="700" fill="#14201F" text-anchor="middle">Approve</text><rect x="922" y="700" width="142" height="40" rx="10" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="993" y="725" font-size="13.5" font-weight="700" fill="#14201F" text-anchor="middle">Revise</text><rect x="1076" y="700" width="142" height="40" rx="10" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="1147" y="725" font-size="13.5" font-weight="700" fill="#14201F" text-anchor="middle">Reject</text></svg>