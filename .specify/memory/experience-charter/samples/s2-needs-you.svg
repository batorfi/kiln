<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">S2 Needs you — sample</title><desc id="d">Hi-fi sample: items waiting on one person, grouped by blocking, suggestions and worth knowing.</desc><rect width="1280" height="820" fill="#F4F1EA"/><rect x="0" y="0" width="200" height="820" fill="#10201F"/><g transform="translate(16 14) scale(.5)"><g fill="none" stroke-width="5.5" stroke-linecap="round"><path d="M6 56V34a26 26 0 0 1 52 0v22" stroke="#2B5C57"/><path d="M15 56V35a17 17 0 0 1 34 0v21" stroke="#1E8F84"/><path d="M24 56V36a8 8 0 0 1 16 0v20" stroke="#2DD4BF"/></g><circle cx="32" cy="45" r="4.2" fill="#2DD4BF"/></g><text x="54" y="38" font-size="19" font-weight="700" letter-spacing="3" fill="#E9EFEC" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">KILN</text><text x="16" y="64" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">Workshop · this machine</text><rect x="8" y="83" width="184" height="28" rx="6" fill="#1B3331"/><rect x="8" y="83" width="3" height="28" fill="#2DD4BF"/><text x="22" y="100" font-size="13" font-weight="600" fill="#E9EFEC" text-anchor="start">Needs you</text><rect x="150" y="86" width="30" height="20" rx="10" fill="#0F766E" stroke="none" stroke-width="0"/><text x="165" y="100" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="22" y="130" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Feed</text><rect x="150" y="116" width="30" height="20" rx="10" fill="#27403D" stroke="none" stroke-width="0"/><text x="165" y="130" font-size="11.5" font-weight="700" fill="#E9EFEC" text-anchor="middle">4</text><text x="22" y="160" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Factories</text><text x="22" y="190" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Team space</text><text x="22" y="220" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Record</text><text x="22" y="250" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Knowledge</text><text x="22" y="280" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Bench</text><text x="22" y="310" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Insights</text><text x="22" y="340" font-size="13" font-weight="400" fill="#B9CBC6" text-anchor="start">Models &amp; policy</text><text x="18" y="392" font-size="10.5" font-weight="600" fill="#7E948F" text-anchor="start">FACTORIES</text><circle cx="24" cy="412" r="4.5" fill="#86D08A"/><text x="36" y="416" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">orders-api</text><text x="182" y="416" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">working</text><circle cx="24" cy="438" r="4.5" fill="#F2B24A"/><text x="36" y="442" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">billing</text><text x="182" y="442" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">waiting</text><circle cx="24" cy="464" r="4.5" fill="#8FB0F5"/><text x="36" y="468" font-size="12.5" font-weight="400" fill="#E9EFEC" text-anchor="start">mobile</text><text x="182" y="468" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="end">new</text><rect x="10" y="742" width="180" height="64" rx="8" fill="#162B29" stroke="none" stroke-width="0"/><text x="20" y="762" font-size="11" font-weight="600" fill="#B9CBC6" text-anchor="start">This machine</text><text x="20" y="780" font-size="11" font-weight="400" fill="#9DB1AC" text-anchor="start">memory 41 of 64 GB in use</text><rect x="20" y="788" width="160" height="5" rx="2.5" fill="#27403D"/><rect x="20" y="788" width="102" height="5" rx="2.5" fill="#2DD4BF"/><text x="230" y="40" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Workshop › Needs you</text><text x="230" y="76" font-size="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">4 things are waiting on you</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">Two of them are stopping a factory. The rest can wait.</text><rect x="1110" y="30" width="140" height="34" rx="8" fill="#0F766E" stroke="#0F766E" stroke-width="1"/><text x="1180.0" y="51.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Feed KILN</text><rect x="230" y="118" width="50.2" height="28" rx="14" fill="#14201F" stroke="#DDD7CA" stroke-width="1"/><text x="244" y="136" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">All</text><rect x="288.2" y="118" width="79.80000000000001" height="28" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="302.2" y="136" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">billing</text><rect x="376.0" y="118" width="102.0" height="28" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="390.0" y="136" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">orders-api</text><rect x="486.0" y="118" width="72.4" height="28" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="500.0" y="136" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">mobile</text><text x="1250" y="136" font-size="12" font-weight="400" fill="#56625F" text-anchor="end">Order: what it blocks, then waited · filter by kind ▾</text><text x="230" y="178" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">WAITING ON YOU</text><rect x="230" y="190" width="1020" height="74" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="246" y="204" width="55.3" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="255" y="219" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="start">●</text><text x="270" y="219" font-size="11.5" font-weight="600" fill="#8A4B04" text-anchor="start">Gate</text><text x="246" y="238" font-size="15" font-weight="600" fill="#14201F" text-anchor="start">Is the retry change ready to merge?</text><text x="246" y="256" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">billing · Code review · judged: 2 findings, none blocking</text><text x="1234" y="218" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="end">stops billing · waited 2 h</text><text x="1234" y="248" font-size="13" font-weight="600" fill="#0F766E" text-anchor="end">Open</text><rect x="230" y="274" width="1020" height="74" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="246" y="288" width="55.3" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="255" y="303" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="start">●</text><text x="270" y="303" font-size="11.5" font-weight="600" fill="#8A4B04" text-anchor="start">Gate</text><text x="246" y="322" font-size="15" font-weight="600" fill="#14201F" text-anchor="start">Which features go into version 3?</text><text x="246" y="340" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">orders-api · Roadmap gate · checked · 6 features</text><text x="1234" y="302" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="end">stops orders-api · waited 40 min</text><text x="1234" y="332" font-size="13" font-weight="600" fill="#0F766E" text-anchor="end">Open</text><rect x="230" y="358" width="1020" height="74" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="246" y="372" width="99.575" height="22" rx="11" fill="#FBE3DF" stroke="none" stroke-width="0"/><text x="255" y="387" font-size="10.5" font-weight="700" fill="#A82A1D" text-anchor="start">✕</text><text x="270" y="387" font-size="11.5" font-weight="600" fill="#A82A1D" text-anchor="start">Policy stop</text><text x="246" y="406" font-size="15" font-weight="600" fill="#14201F" text-anchor="start">billing asked a cloud model to read invoices/</text><text x="246" y="424" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">Blocked by the local-only rule · allow once, or keep blocked</text><text x="1234" y="386" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="end">stops one step · waited 3 h</text><text x="1234" y="416" font-size="13" font-weight="600" fill="#0F766E" text-anchor="end">Open</text><rect x="230" y="442" width="1020" height="74" rx="12" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><rect x="246" y="456" width="80.6" height="22" rx="11" fill="#E2EAFB" stroke="none" stroke-width="0"/><text x="255" y="471" font-size="10.5" font-weight="700" fill="#1F4FB8" text-anchor="start">ⓘ</text><text x="270" y="471" font-size="11.5" font-weight="600" fill="#1F4FB8" text-anchor="start">Question</text><text x="246" y="490" font-size="15" font-weight="600" fill="#14201F" text-anchor="start">Should the retry limit be a setting?</text><text x="246" y="508" font-size="12" font-weight="400" fill="#56625F" text-anchor="start">From the Specification step in orders-api · answer in your words</text><text x="1234" y="470" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="end">waited 1 day</text><text x="1234" y="500" font-size="13" font-weight="600" fill="#0F766E" text-anchor="end">Open</text><text x="230" y="548" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">SUGGESTIONS — NOTHING IS STOPPED</text><rect x="230" y="558" width="500" height="118" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="590" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">Promote a spike to a candidate</text><text x="248" y="612" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">The swap-cost spike answered its question. Add it to the roadmap</text><text x="248" y="629" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">candidates, or leave it.</text><text x="248" y="664" font-size="13" font-weight="600" fill="#0F766E" text-anchor="start">Look at it</text><text x="750" y="548" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">WORTH KNOWING — NO ACTION</text><rect x="750" y="558" width="500" height="118" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="768" y="590" font-size="14" font-weight="600" fill="#14201F" text-anchor="start">Delegation ended in orders-api</text><text x="768" y="612" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">Anna objected at Documentation. The gate is back with you, waiting</text><text x="768" y="629" font-size="12.5" font-weight="400" fill="#56625F" text-anchor="start">like any other.</text><rect x="230" y="696" width="1020" height="100" rx="14" fill="#EAF5F2" stroke="#A9D3CC" stroke-width="1"/><text x="250" y="728" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">What Needs you never does</text><text x="250" y="750" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">It never decides, approves or expires anything. Waiting never escalates and never times out. It only notifies you about items waiting on</text><text x="250" y="769" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">you.</text></svg>