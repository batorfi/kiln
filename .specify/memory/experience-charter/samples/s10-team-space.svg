68" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="908" y="402" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">PUBLISHED</text><text x="906" y="416" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Bence published a feature story: Docs search.</text><text x="906" y="434" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Anna published her gate record for payments.</text><rect x="890" y="556" width="360" height="232" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="908" y="582" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">TEAM RULES</text><text x="906" y="596" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">Merge needs one other approval · policy floor:</text><text x="906" y="613" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">local-only for secrets · protected paths include</text><text x="906" y="630" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">the constitution, charter and design system —</text><text x="906" y="647" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">changes by pull request, approved by their named</text><text x="906" y="664" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">owners.</text></svg>