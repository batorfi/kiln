ze="28" font-weight="700" fill="#14201F" font-family="Charter, Bitstream Charter, Iowan Old Style, Georgia, serif">Is the retry change ready to merge?</text><text x="230" y="100" font-size="13.5" font-weight="400" fill="#56625F" text-anchor="start">Code review · judged · round 1 · waited 2 h · decided so far by Zsolt</text><rect x="1020" y="28" width="124.87500000000001" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="1029" y="43" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="start">●</text><text x="1044" y="43" font-size="11.5" font-weight="600" fill="#8A4B04" text-anchor="start">Waiting for you</text><rect x="1150" y="28" width="55.95" height="22" rx="11" fill="#EFEBE1" stroke="none" stroke-width="0"/><text x="1159" y="43" font-size="11.5" font-weight="500" fill="#14201F" text-anchor="start">hybrid</text><rect x="230" y="112" width="650" height="78" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><line x1="262" y1="138" x2="852" y2="138" stroke="#DDD7CA" stroke-width="2"/><circle cx="262.0" cy="138" r="10" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/><text x="262.0" y="142" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="262.0" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Roadmap</text><circle cx="315.6363636363636" cy="138" r="10" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/><text x="315.6363636363636" y="142" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="315.6363636363636" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Concept</text><circle cx="369.27272727272725" cy="138" r="10" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/><text x="369.27272727272725" y="142" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="369.27272727272725" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Arch.</text><circle cx="422.9090909090909" cy="138" r="10" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/><text x="422.9090909090909" y="142" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="422.9090909090909" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Exp.</text><circle cx="476.5454545454545" cy="138" r="10" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/><text x="476.5454545454545" y="142" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="476.5454545454545" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Spec</text><circle cx="530.1818181818182" cy="138" r="10" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/><text x="530.1818181818182" y="142" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="530.1818181818182" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Plan</text><circle cx="583.8181818181818" cy="138" r="10" fill="#0F766E" stroke="#0F766E" stroke-width="1.6"/><text x="583.8181818181818" y="142" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="583.8181818181818" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Build</text><circle cx="637.4545454545455" cy="138" r="10" fill="#FBEBCB" stroke="#8A4B04" stroke-width="1.6"/><text x="637.4545454545455" y="142" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="middle">●</text><text x="637.4545454545455" y="164" font-size="10.5" font-weight="600" fill="#8A4B04" text-anchor="middle">Review</text><circle cx="691.090909090909" cy="138" r="10" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1.6"/><text x="691.090909090909" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">UI</text><circle cx="744.7272727272727" cy="138" r="10" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1.6"/><text x="744.7272727272727" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Verify</text><circle cx="798.3636363636364" cy="138" r="10" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1.6"/><text x="798.3636363636364" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Docs</text><circle cx="852.0" cy="138" r="10" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1.6"/><text x="852.0" y="164" font-size="10.5" font-weight="400" fill="#56625F" text-anchor="middle">Merge</text><rect x="230" y="200" width="650" height="80" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="226" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THE DECISION</text><text x="248" y="242" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Approving commits the change to the Documentation gate. It does not commit to merging. At</text><text x="248" y="259" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">stake if wrong: a retry limit that cannot be configured.</text><rect x="230" y="290" width="650" height="164" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="316" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THE WORK</text><text x="248" y="332" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">Retry limits are now read from settings instead of a constant. 14 files changed; the</text><text x="248" y="350" font-size="13" font-weight="400" fill="#14201F" text-anchor="start">default stays 3.</text><rect x="248" y="366" width="614" height="74" rx="8" fill="#10201F" stroke="none" stroke-width="0"/><text x="262" y="390" font-size="12" fill="#F59E92" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">- const RETRY_LIMIT = 3;</text><text x="262" y="410" font-size="12" fill="#86D08A" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">+ const limit = settings.get('retries.limit', 3);</text><text x="262" y="430" font-size="11" fill="#9DB1AC" font-family="ui-monospace, DejaVu Sans Mono, SF Mono, Menlo, monospace">  src/retry.ts:41</text><rect x="230" y="464" width="650" height="110" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="490" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THE YARDSTICK</text><text x="248" y="504" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Specification v2 (approved 9 Oct) · Constitution 2.1.0, Principle VI · Charter pinned 0.1.0</text><text x="248" y="521" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">· Knowledge: retry policy page, cited.</text><rect x="230" y="584" width="650" height="120" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="610" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">THE EVIDENCE</text><rect x="380" y="592" width="194.45000000000002" height="22" rx="11" fill="#FBEBCB" stroke="none" stroke-width="0"/><text x="389" y="607" font-size="10.5" font-weight="700" fill="#8A4B04" text-anchor="start">●</text><text x="404" y="607" font-size="11.5" font-weight="600" fill="#8A4B04" text-anchor="start">2 findings · none blocking</text><rect x="574" y="592" width="93.25" height="22" rx="11" fill="#E1F0DC" stroke="none" stroke-width="0"/><text x="583" y="607" font-size="10.5" font-weight="700" fill="#276B2A" text-anchor="start">✓</text><text x="598" y="607" font-size="11.5" font-weight="600" fill="#276B2A" text-anchor="start">128 passed</text><text x="248" y="646" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">Judge: retry limit validated on save is untested in one path. Staging checkout flow could not</text><text x="248" y="662" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">run on this machine — shown as missing, not passed.</text><rect x="230" y="714" width="650" height="74" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="248" y="740" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">RISKS AND OPEN ISSUES</text><text x="248" y="758" font-size="12.5" font-weight="400" fill="#14201F" text-anchor="start">Overlap with Anna's factory on shared/config.ts · no staging evidence</text><rect x="900" y="112" width="350" height="400" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="918" y="138" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">YOUR OPTIONS</text><text x="918" y="156" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">No move is selected. You decide as Zsolt.</text><rect x="918" y="170" width="314" height="52" rx="10" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="934" y="192" font-size="14" font-weight="700" fill="#14201F" text-anchor="start">Approve</text><text x="934" y="210" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">moves to Documentation</text><rect x="918" y="232" width="314" height="52" rx="10" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="934" y="254" font-size="14" font-weight="700" fill="#14201F" text-anchor="start">Revise</text><text x="934" y="272" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">your note goes back to the same author</text><rect x="918" y="294" width="314" height="52" rx="10" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="934" y="316" font-size="14" font-weight="700" fill="#14201F" text-anchor="start">Reject</text><text x="934" y="334" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">a fresh author — or an earlier gate you name</text><rect x="918" y="356" width="314" height="52" rx="10" fill="#FFFFFF" stroke="#7F8985" stroke-width="1"/><text x="934" y="378" font-size="14" font-weight="700" fill="#14201F" text-anchor="start">Restart</text><text x="934" y="396" font-size="11.5" font-weight="400" fill="#56625F" text-anchor="start">from the restorable commit</text><text x="918" y="432" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">Note (required when sending back)</text><rect x="918" y="442" width="314" height="56" rx="8" fill="#FAF8F3" stroke="#7F8985" stroke-width="1"/><rect x="900" y="524" width="350" height="120" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="918" y="550" font-size="10.5" font-weight="600" fill="#56625F" text-anchor="start">OTHER ACTIONS</text><text x="918" y="564" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">Ask about the work · request more evidence · read</text><text x="918" y="581" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">deeper · hand over · leave it waiting. None</text><text x="918" y="598" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">decides the gate.</text><rect x="900" y="656" width="350" height="62" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="918" y="680" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">Provenance</text><text x="918" y="702" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">writer · cloud · billing host · steered once by you</text><rect x="900" y="728" width="350" height="60" rx="14" fill="#FFFFFF" stroke="#DDD7CA" stroke-width="1"/><text x="918" y="752" font-size="11.5" font-weight="600" fill="#56625F" text-anchor="start">History</text><text x="918" y="772" font-size="12" font-weight="400" fill="#14201F" text-anchor="start">round 1 · delegation off · stopped: judged gate</text></svg>